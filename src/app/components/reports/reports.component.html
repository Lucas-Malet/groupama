<mat-card class="report-card">
<mat-card-header class="header">
    <mat-card-title>Rapports</mat-card-title>
    <button mat-stroked-button (click)="openAddReportDialog()">
      <mat-icon>add</mat-icon>
      Ajouter un rapport
    </button>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- Date -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let report">
          {{ report.date | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <!-- Titre -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Titre</th>
        <td mat-cell *matCellDef="let report">{{ report.title }}</td>
      </ng-container>

      <!-- Mission -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Mission</th>
        <td mat-cell *matCellDef="let report">{{ report.missionId }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let report">
          <button mat-button color="primary" (click)="openReportDetailsDialog(report)">
            Ouvrir
          </button>
        </td>
      </ng-container>

      <!-- Header and rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Paginator -->
    <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>

  </mat-card-content>
</mat-card>
